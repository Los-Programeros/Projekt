name: Auto Server Deployment

on:
  push:
    branches:
      - main

jobs:

  server-upload:
    name: Server Upload
    runs-on: self-hosted
    steps:
    - name: Get project from Github
      uses: actions/checkout@v4
    
    - name: Install upload tools
      run: |
        if ! command -v sshpass &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y sshpass rsync
        fi

    - name: Upload files via Rsync
      run: |
        sshpass -p "${{ secrets.SSH_PASSWORD }}" rsync -avz --delete \
          --exclude='.git' \
          --exclude='.github' \
          --exclude='NPO/app' \
          --exclude='RAIN/web-scrapper' \
          --no-perms --no-owner --no-group \
          ./ ${{ secrets.SSH_USERNAME }}@${{ secrets.SERVER_URL }}:./deployment/

  server-setup:
    name: Server Setup
    runs-on: self-hosted
    needs: server-upload
    steps:

      - name: Unzip negatives
        uses: garygrossgarten/github-action-ssh@release
        with:
          command: |
            unzip -o ./deployment/ORV/app/data/negatives.zip -d ./deployment/ORV/app/data
          host: ${{ secrets.SERVER_URL }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}

      - name: Clean and setup containers
        uses: garygrossgarten/github-action-ssh@release
        with:
          command: |
            export PATH=$PATH:/usr/bin:/usr/local/bin
            cd ./deployment/
            bash server-clean.sh
            bash server-setup.sh
          host: ${{ secrets.SERVER_URL }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}

